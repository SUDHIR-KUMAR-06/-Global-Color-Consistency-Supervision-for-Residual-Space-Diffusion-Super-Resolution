binary_data_dir: data/binary/df2k4x
# Point these at your copy. Flickr2K is optional (a non-matching glob is simply
# skipped). If no test glob matches, the tail of the train list is held out.
df2k_train_globs:
  - data/raw/DIV2K_train_HR/*.png
  - data/raw/Flickr2K/Flickr2K_HR/*.png
df2k_test_globs:
  - data/raw/DIV2K_valid_HR/*.png
df2k_holdout_test: 20
df2k_max_train_imgs: -1  # -1 = use all
patch_size: 160
crop_size: 320
thresh_size: 160
test_crop_size: [ 2040, 2040 ]
test_thresh_size: 0
valid_steps: 4
num_sanity_val_steps: 4
eval_batch_size: 1
test_batch_size: 1
sr_scale: 4