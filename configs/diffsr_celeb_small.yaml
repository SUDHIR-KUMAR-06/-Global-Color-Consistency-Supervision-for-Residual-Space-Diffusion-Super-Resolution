base_config:
  - ./diffsr_base.yaml
  - ./celeb_a_small.yaml
trainer_cls: tasks.srdiff_celeb.SRDiffCeleb

# CC-ResDiff baseline arm: unmodified SRDiff noise-prediction loss only.
# Reduced model/schedule to fit a single 4GB GPU / Colab T4 at 16x16 -> 64x64 (4x).
hidden_size: 32
unet_dim_mults: 1|2|2|4
rrdb_num_feat: 16
rrdb_num_block: 4
rrdb_ckpt: 'checkpoints/rrdb_celebA_small'

batch_size: 16
max_updates: 20000
decay_steps: 8000
val_check_interval: 1000
num_ckpt_keep: 3
amp: true

# Early stopping. Deliberately monitors PSNR (a neutral distortion metric) rather
# than color_error, so the criterion cannot favour the CC-ResDiff arm; both arms
# use identical settings.
early_stop: true
early_stop_key: psnr
early_stop_mode: max
early_stop_patience: 5
early_stop_min_delta: 0.01

use_color_loss: false
